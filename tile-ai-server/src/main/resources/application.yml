server:
  port: 8080

spring:
  application:
    name: tile-ai-server

  # 文件上传(批量导入,架构 §8.7)。
  # ⚠️ **Spring Boot 默认单文件只收 1MB**,而导入代码允许 **20000 行**
  # (SpreadsheetReader.MAX_ROWS)—— 一份上万行的 CSV 轻松超过 1MB,
  # **默认值等于把整个导入功能挡在门外**,而且报出来的是 90001「系统内部错误」,
  # 用户会以为服务挂了。这里按"2 万行 × 约 11 列"的实际体量给 20MB(约 3~10 倍余量)。
  # 单行塞满长 URL 的超大文件属"请拆分重导",不为了它把上限放到吃爆堆
  # —— 读取时是整份进内存的(file.getBytes())。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
      # 超过 1MB 落临时文件,不驻留堆。导入执行器并发很低,这样更稳。
      file-size-threshold: 1MB

  # 数据库口令**不落代码**(架构 §12.3 / §13.6):一律走环境变量。
  # 本地开发可另建 application-local.yml(.gitignore 已排除)覆盖,或设 DB_* 环境变量。
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tile_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 版本化迁移(架构 §12.3:数据库变更与代码同批次且可回退)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Redis(架构 §3):登录会话 / refresh_token 黑名单、限流、热点缓存
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  # RabbitMQ(P0-3① 裁决;拓扑见 RabbitTopologyConfig)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:tileai}
    password: ${RABBITMQ_PASS:tileai}

tile:
  # 鉴权与会话(架构 §10.1 · D1 定稿)。时长与 Cookie 属性直接来自契约
  # openapi-common.yaml#/components/securitySchemes/cookieAuth,改动等同改契约。
  auth:
    # 密钥只走环境变量(§13.6)。留空时:非 prod 自动生成随机密钥(重启即失效),
    # prod 直接拒绝启动。
    secret: ${JWT_SECRET:}
    access-ttl: 2h
    refresh-ttl: 14d
    access-cookie-path: /
    # refresh_token 只在 /api/v1/auth 下发送 —— 收窄暴露面(契约明确要求)
    refresh-cookie-path: /api/v1/auth
    # 架构未规定 SameSite(上游未定义项),此处取 Lax;见 JwtProperties 说明
    same-site: Lax
    # HTTPS 下必须置 true(生产);本地 http 保持 false,否则浏览器不保存 Cookie
    secure: ${COOKIE_SECURE:false}

  # Python 智能体服务(架构 §6.1)。Java 侧唯一出网口,见 AgentClient。
  # 仅内网可达;/internal/* 对外由网关阻断(§6.1、§12.1)。
  agent:
    base-url: ${AGENT_BASE_URL:http://localhost:8000}
    # 服务令牌**只走环境变量**(§13.6)。留空时不发送该头,Python 侧也放行 —— 便于本地联调;
    # 生产必须配置。
    service-token: ${AGENT_SERVICE_TOKEN:}
    # 解析含一次模型调用(实测真实解析约 2–5s),给足余量但仍要有限 ——
    # 没有超时的内部调用会把上游请求线程一起拖住。
    timeout: 30s
    # 对话流(SSE,T-1.6)的超时。一次问答是"检索 + 流式生成",比一次解析长得多。
    # 它同时是 Spring MVC 异步超时与出网请求超时的上界 —— **不配会把长回答截断**。
    chat-timeout: ${AGENT_CHAT_TIMEOUT:180s}

  # 隐私字段的静态加密(架构 §13.5 / §8.3):t_layout.layout_enc / t_plan.layout_enc
  crypto:
    # Base64 编码的 32 字节密钥,**只走环境变量**(§13.6)。本地生成:
    #   openssl rand -base64 32
    # 留空时应用照常启动,但任何"保存方案"都会失败 —— 刻意不退化明文(见 AesGcmCipher)。
    layout-key: ${LAYOUT_ENC_KEY:}

  # 生成编排(架构 §6.4)。这几个数字**上游一个都没给**,取值理由见
  # openapi-verification.md §35.1 —— 改这里等于改那节。
  generate:
    # pending 卡住阈值。注意:还有待发的 outbox 行时不算卡住(投递器仍在处理它)
    pending-stuck-after: 60s
    # running 卡住阈值 = 最坏真实耗时(4 张 × 60s)的 1.5 倍。
    # 活着的任务扫不到它 —— 每次进度回调都会刷新 updated_at
    running-stuck-after: 360s
    # 重投上限。每次重投都可能等于 4 次真实模型调用,要比索引同步收得紧
    max-attempts: 3
    # 硬截止:给 running 分支兜底(一直"活着"地卡着的任务,单靠上面那条永远等不到)
    hard-deadline: 30m
    compensation-enabled: true
    # 扫描间隔。它是安全网不是主路径;§13.7 的告警窗口是 5 分钟,60s 落在窗口之内
    compensation-interval: 60s

  # Outbox 投递(架构 §6.4)
  outbox:
    enabled: true
    batch-size: 100
    # 重试超限后标记 failed 并停止,由「全量重建」兜底(架构 §15.2)
    max-retry: 10
    dispatch-interval: 2s

  # 分享链接(T-1.13;契约 openapi-c.yaml 的 share 分组)。
  # ⚠️ 这个域名指向**前端页面**,不是 API —— 拿到链接的人是在浏览器里打开一个页面,
  # 不是去调接口。别顺手改成 agent.base-url 那个地址。
  # ⚠️ 上线前**必须**配 SHARE_BASE_URL:留成默认值的后果是分享出去一条指向
  # localhost 的链接,而且是**发给别人**的 —— 分享者自己在浏览器里试不出来。
  # 详见 openapi-verification.md §43。
  share:
    base-url: ${SHARE_BASE_URL:http://localhost:5173}

  # 效果图的本地存储(架构 §15.5)。真实图像模型返回的是 24 小时过期的 OSS
  # 临时地址,回调时把图抓进本机磁盘,库里改存长期有效的自有地址。
  storage:
    enabled: ${STORAGE_ENABLED:true}
    # 落盘目录。默认在用户主目录下 —— 不用相对路径,因为"相对谁的工作目录"
    # 在 IDE 与 mvn 下并不一致,那会变成"图到底存哪了"的问题。
    root: ${STORAGE_ROOT:${user.home}/.tile-ai/media}
    # ⚠️ 这一项是**本服务(Java)的对外地址**,不是前端地址 —— 别照抄上面的
    # SHARE_BASE_URL(那个指向前端页面,默认 5173)。填错的后果是图片地址
    # 打到前端站而 404,而且只在浏览器里看得出来。上线必配。
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    media-path: /media
    # 除 public-base-url 之外还当成"自己的地址"的。命中的 URL 跳过转存 ——
    # 占位图模式(MODEL_IMAGE_PROVIDER=placeholder)靠它零开销。
    own-base-urls: []
    connect-timeout: 3s
    read-timeout: 10s
    # ⚠️ 一次成功回调的下载总预算,**必须小于 Python 的 java_callback_timeout_seconds**
    # (当前 10s)。超预算就放弃剩余图、保留临时地址。这不是性能调优:下载挂太久
    # 会让任务迟迟到不了 success,补偿扫描(360s)会把它当卡住重投,
    # 那等于重跑一次真实模型、白烧额度。
    overall-budget: 8s
    max-bytes: 10485760
    max-images: 8

mybatis-plus:
  configuration:
    # DB 用 snake_case,对外 JSON 用 camelCase,映射在 ORM 层完成(CLAUDE.md 命名约定)
    map-underscore-to-camel-case: true

# 健康检查供 T-0.1 验收与 T-2.4 部署编排(Docker Compose healthcheck)使用。
# 仅暴露 health/info;其余端点默认关闭,避免泄露内部状态(架构 §13.5 安全)。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
