# ============================================================================
# 本地开发用的中间件编排 —— 只跑基础设施,不含应用。
#
# 完整的一期部署编排(Nginx + Java + Python + 全部中间件 + /internal 阻断)
# 是 T-2.4 的产出,不在本文件内。
#
# 用法:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml ps
#   docker compose -f deploy/docker-compose.dev.yml down
#
# 为什么 MySQL 不在里面:本机用的是**原生安装**的 MySQL 8(Windows 服务 MySQL80,
# 127.0.0.1:3306),不重复容器化。其余中间件走容器。
#
# 依据:架构 §12.1(一期拓扑)、§13.4(容灾:Redis AOF)。
# ============================================================================

services:

  # Redis —— 短信验证码、refresh_token 黑名单、限流、热点缓存(架构 §3)
  redis:
    image: redis:7-alpine
    container_name: tile-ai-redis
    ports:
      - "6379:6379"
    # 开 AOF:§13.4 要求 Redis 持久化,否则重启即丢黑名单,已登出的令牌会复活。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Qdrant —— 产品 / 搭配 / 知识库的向量检索(架构 §9)
  # ⚠️ 它是**派生索引**:权威数据在 MySQL,可随时全量重建,不参与业务事务。
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: tile-ai-qdrant
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    # 未配 healthcheck:官方镜像里没有 curl/wget,写 TCP 探测反而更脆;
    # 且 Qdrant 是派生索引,容器重启后索引可重建,健康检查的收益有限。
    restart: unless-stopped

  # RabbitMQ —— 异步任务:Mq 消息(架构 §6.2;P0-3① 已裁决一期采用 RabbitMQ)
  # 用途:queue.generate(生成任务)、queue.index.sync(向量索引同步)及各自的 DLQ。
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tile-ai-rabbitmq
    # ⚠️ **主机名必须钉死**(2026-10-03 踩到,见 openapi-verification.md §63)。
    #
    # 原因:RabbitMQ 的节点名默认取容器主机名(不钉就是容器 ID),而**数据目录按节点名分开**。
    # 于是 `docker compose up` 重建容器(改个环境变量就会重建)会换掉节点身份 ——
    # 新节点看到一个空目录,**队列与消息"凭空消失"**,旧数据其实还躺在卷里认不出来。
    # 实测:一次重建让 durable 队列与其中 65 条消息全部"不见了"。
    hostname: tile-ai-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理台,便于排查队列积压与 DLQ
    environment:
      # 口令走环境变量,默认值仅供本地开发;生产必须另行注入(架构 §13.6)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tileai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-tileai}
      # ⚠️ 心跳从默认的 60 秒放宽到 900 秒(2026-10-03,见 openapi-verification.md §63)。
      #
      # 为什么:消费端是**同步阻塞**的 —— 它在等模型出图的那几分钟里发不出心跳
      # (最长 600 秒),broker 于是把它当死连接掐掉 ⇒ 消息被重投 ⇒ **同一单跑两遍、
      # 白花一次模型调用**。实测:一次 4 角度的任务跑了 4 分 44 秒,连接就是那么断的。
      #
      # ⚠️ 心跳是**协商值**,取 min(客户端, 服务端):这里改的是服务端,
      # 客户端(消费端)在 tile-ai-agent 的 `rabbitmq_heartbeat_seconds`。
      # **只改一边等于没改。** Java 侧不用动 —— 它提的是 60 秒,取 min 后仍是 60,
      # 而它的调用都是短操作。
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit heartbeat 900"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
  rabbitmq-data:
