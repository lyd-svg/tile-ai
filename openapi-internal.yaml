openapi: 3.0.3

info:
  title: 瓷砖选购 AI 效果图与报价系统 — 内部契约(Java ↔ Python)
  version: 0.1.0
  description: |
    内部接口契约,仅内网可达;网关层阻断 /internal/* 的外部访问(§6.1、§12.1)。
    鉴权:服务令牌 `X-Service-Token`(叠加内网 mTLS),不使用用户 JWT。§10.4

    方向标注:
    - Java → Python:Java 派发编排/解析/映射/补齐任务给智能体服务。
    - Python → Java:智能体服务向 Java 取权威数据、回传生成结果。

    复用同一套错误码(§10.5);服务间调用失败以 4xxx/5xxx 返回并附 traceId。
    **无 /internal/quote/calc** —— 报价归 Java,智能体不接报价工具(一致性评审 A1,§4.1、§6.1)。

    约定的"TODO"标记:`x-todo` 表示上游未定义、由契约作者推断,待评审。

    ------------------------------------------------------------------
    两条**跨端点**的约定(2026-09-29 评审确定,架构 §10.4):
    ------------------------------------------------------------------

    1. **错误码与对外同一套,但 Java 只透传「已定义的业务码」。**
       本组接口的失败直接用 §10.5 的业务码,不引入"内部码 → 对外码"映射表
       (那会多出一处最容易漂的东西)。但**未定义的内部异常**(Python 抛的技术性错误)
       由 Java **折算为 90001**,不透传 —— 否则内部实现细节会漏到用户界面。

    2. **SSE 流中途失败的表达见 `/internal/agent/chat`**:流一旦开始,
       HTTP 状态码就改不了,错误只能用事件表达。

servers:
  - url: http://{python-agent-host}:8000
    description: Python 智能体服务(内网;Java→Python 调用)
    variables:
      python-agent-host: { default: python-agent }
  - url: http://{java-core-host}:8080
    description: Java 业务核(内网;Python→Java 调用)
    variables:
      java-core-host: { default: java-core }

security:
  - serviceToken: []

tags:
  - name: agent
    description: 智能体能力(Java → Python)
  - name: data
    description: 权威数据读取(Python → Java)
  - name: generate
    description: 生成结果回传(Python → Java)

paths:

  # ==========================================================
  # Java → Python
  # ==========================================================
  /internal/agent/chat:
    post:
      tags: [agent]
      x-direction: Java → Python
      summary: 对话咨询编排(路径 C,SSE)
      description: |
        Java 将用户消息转发给智能体服务,智能体基于产品库 RAG 返回流式 token 与可采纳 refs。
        智能体**仅输出搭配建议 + 搭配方案**,不返回效果图、不返回报价(§4.2 输出边界、§10.6③)。
        会话短期上下文存 Redis(sessionId 键、TTL 约 30 分钟),长期消息由 Java 落库 t_chat_message(§4.2)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, message]
              properties:
                sessionId: { type: string, example: "s_88" }
                userId: { type: integer, description: "已登录用户(由 Java 透传,用于鉴权与留痕)" }
                message: { type: string, example: "卫生间浅灰砖配什么墙砖?" }
                context:
                  type: object
                  description: 可选上下文(如已选空间/风格),用于约束推荐范围
                  additionalProperties: true
      responses:
        '200':
          description: |
            SSE 流式事件(D-7 裁决冻结,2026-09-29 补 `error`)。**两种结局互斥**:

            **正常**:若干 `data: {"delta": "..."}` → 至多一个 `data: {"refs":[...]}` → `data: [DONE]`
            **失败**:若干 `data: {"delta": "..."}`(可能没有)→ 一个 `data: {"error":{...}}`,**不再发 `[DONE]`**

            application/json 为备用载体:非流式聚合返回(若 Java 侧选择非 SSE 调用)。
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  逐行事件。delta 为增量文本;refs 为可采纳的搭配方案(SkuRef[]);
                  正常结束标记 `data: [DONE]`。

                  **`error` 事件(2026-09-29 补)**:流一旦开始,HTTP 状态码就改不了,
                  故模型超时、内容安全拦截这类**流中途失败只能用事件表达**。
                  若没有它,前端只能靠"流意外断开"推断失败 —— 而网络抖动也会断,
                  两者分辨不出的直接后果是**前端无法决定要不要重试**。

                  `error` 必为**最后一帧**,且**与 `[DONE]` 互斥** —— 若两者都发,
                  前端就得猜哪个算数。
                example: |
                  data: {"sessionId":"s_88"}
                  data: {"delta":"浅灰地砖建议搭配…"}
                  data: {"refs":[{"sku":"TL-3012","name":"雪瓷白","part":"wall"}]}
                  data: [DONE]
            application/json:
              schema: { $ref: './openapi-common.yaml#/components/schemas/ApiResponse' }
      x-note: |
        失败示例(与上面的 200 是同一状态码的另一种结局,仅示意事件形状):

        ```
        data: {"sessionId":"s_88"}
        data: {"delta":"浅灰地砖…"}
        data: {"error":{"code":90001,"message":"模型调用超时","traceId":"..."}}
        ```

        `error` 事件形状:`{error: {code, message, traceId}}`,`code` 取 §10.5 业务码。

  /internal/agent/parse-layout:
    post:
      tags: [agent]
      x-direction: Java → Python
      summary: 自然语言/参数 → 结构化户型
      description: |
        将用户的自然语言或表单参数解析为结构化户型数据模型(长/宽/高/门窗)。解析在 Python,
        结果交 Java 落库(§4.3 工具②、§5.3.2)。户型入库后**不做人工校准**(§5.3)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                两种输入形态:`text`(自然语言)或 `params`(结构化表单)。

                **优先级:`params` 优先于 `text`** —— 结构化是用户明确填的,文本是模糊描述。
                两者都不给 → **10001**。
              properties:
                text: { type: string, description: 自然语言描述, example: "三室两厅,客厅 5m×4m,卫生间 2m×1.8m" }
                params:
                  allOf: [{ $ref: './openapi-common.yaml#/components/schemas/LayoutModel' }]
                  description: 直接表单录入的结构化参数(可选;**与 text 同时给时以本字段为准**)
      responses:
        '200':
          description: |
            解析成功,直接返回 `LayoutModel`。

            **失败(解析不出完整户型)按 10001 返回**(D-6 裁决),并用 `data.errors[]`
            说明缺哪一项,例如 `{"field":"spaces[0].length","reason":"未给出客厅长宽"}`。

            **不返回半成品**:`LayoutSpace` 的尺寸是**报价的输入**,缺尺寸会让面积算错、
            报价悄悄偏掉 —— 宁可让用户补齐,也不能让一个看起来成功的户型流进报价。
            提示用户补齐所需的"缺哪几项"就放在 `data.errors[]` 里,不需要新字段。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './openapi-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: './openapi-common.yaml#/components/schemas/LayoutModel' }

  /internal/agent/material-map:
    post:
      tags: [agent]
      x-direction: Java → Python
      summary: 部位材质 → 提示词(SKU → 材质/纹理/颜色短语)
      description: |
        将各部位所选 SKU 映射为出图提示词片段(按地面/墙面/局部对号入座)。§4.2 材质映射、§7.3。
        SKU 详情取自 Java/Qdrant(§4.3 工具③)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                space: { $ref: './openapi-common.yaml#/components/schemas/SpaceType' }
                style: { $ref: './openapi-common.yaml#/components/schemas/StyleType' }
                parts:
                  type: array
                  minItems: 1
                  items: { $ref: './openapi-common.yaml#/components/schemas/PartSelection' }
      responses:
        '200':
          description: 映射成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './openapi-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          parts:
                            type: array
                            items:
                              type: object
                              required: [part, sku, phrases]
                              properties:
                                part: { $ref: './openapi-common.yaml#/components/schemas/Part' }
                                sku: { type: string }
                                phrases:
                                  type: object
                                  description: 该部位瓷砖的**结构化材质短语**(§7.3)
                                  properties:
                                    material: { type: string, example: 釉面砖 }
                                    surface: { type: string, description: 光泽度, example: 柔光 }
                                    colorPattern: { type: string, example: 浅灰细石纹 }
                                    spec: { type: string, example: 750×1500mm }
      x-note: |
        **为什么是结构化片段而不是整段 prompt**:架构 §7.3 把「材质映射」与「场景组装」
        (空间类型 + 风格 + 各部位材质 + 陈设 + 视角)**分成两步**,整段提示词是**组装**的产物,
        不该在这一步产出。结构化片段还**可断言** —— 测试能直接验"地面那块砖的
        colorPattern 进没进去",而整段文本只能靠字符串包含,弱得多。组装在生成流程内部完成。

        ⚠️ **本端点是否真会被调用,待 T-1.11 判定。** 若"场景组装"就在生成消费端(Python 内部),
        则 Java 不需要绕这一圈,本端点即为**预留**;若 Java 侧需要预览提示词,它才有调用方。
        在 T-1.11 落地前,**不要把"有调用方"当成既定事实** —— 一个没有调用方的端点
        写得很详细,就成了没人测的契约面。

  /internal/agent/complete-parts:
    post:
      tags: [agent]
      x-direction: Java → Python
      summary: 未选地面/墙面部位的 AI 自动补齐
      description: |
        生成流程中,对**未选的地面/墙面**部位,基于已选砖 + 空间 + 风格做 AI 自动补齐(返回 SKU + 部位)。
        补齐结果交 Java 落库并参与报价。§4.2 搭配补齐、§11.2 时序。
        注:**局部(腰线/花砖)为可选部位,不强制补齐**(PRD §5.2.4)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space, selectedParts]
              properties:
                space: { $ref: './openapi-common.yaml#/components/schemas/SpaceType' }
                style: { $ref: './openapi-common.yaml#/components/schemas/StyleType' }
                selectedParts:
                  type: array
                  description: 用户已选的部位(可部分);缺失的地面/墙面由本接口补齐
                  items: { $ref: './openapi-common.yaml#/components/schemas/PartSelection' }
      responses:
        '200':
          description: 补齐成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './openapi-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          parts:
                            type: array
                            description: 合并后的完整部位列表,补齐项 source=ai(§11.2"标注 ai")
                            items: { $ref: './openapi-common.yaml#/components/schemas/PartSelection' }
        # 失败场景:补齐未成功 → 业务码 40004(部位补齐失败,用户可重试),HTTP 仍返回 200
      x-note: |
        **40004 既是内部返回码,也是用户看到的码** —— 本组接口复用同一套业务码(见文首约定),
        Java **原样透传**,不做映射。

        理由:引入"内部码 → 对外码"映射表会多出一处最容易漂的东西,而且加了码忘了映射,
        症状是"用户看到一个莫名其妙的数字"。**但 Java 只透传已定义的业务码**,
        未定义的内部异常一律折算 90001。

  # ==========================================================
  # Python → Java
  # ==========================================================
  /internal/products/{sku}:
    get:
      tags: [data]
      x-direction: Python → Java
      summary: 取权威 SKU
      description: 智能体检索/推荐/材质映射时取权威 SKU 数据(§4.3、§5 关键约定)。§10.4
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
          description: 产品编号
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './openapi-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: './openapi-common.yaml#/components/schemas/Sku' }

  /internal/furnish/prompts:
    get:
      tags: [data]
      x-direction: Python → Java
      summary: 取陈设提示词
      description: |
        按"空间 × 风格"取陈设提示词(数据源由 Java 后台维护,§4.2、§5.7),拼入出图提示词。§10.4
      parameters:
        - name: space
          in: query
          required: true
          schema: { $ref: './openapi-common.yaml#/components/schemas/SpaceType' }
        - name: style
          in: query
          required: true
          schema: { $ref: './openapi-common.yaml#/components/schemas/StyleType' }
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './openapi-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          prompt: { type: string, description: 陈设提示词;未配置时为空串 }
                          coverImage: { type: string, nullable: true, description: 展示图 URL(可选) }
                          furnishConfigured:
                            type: boolean
                            description: 该「空间 × 风格」是否已在后台配置。未配置时为 false
      x-note: |
        **入参只有 `space` + `style`** —— 与 `t_furnish_style` 的唯一键一致(架构 §8.5),没有别的数据源。

        **未配置时降级,不报错**(架构 §13.3「降级不阻断主流程」):

        返回 `prompt: ""` + **`furnishConfigured: false`**,生成照常进行,Python 侧记 **WARN 日志**。

        为什么不返 30001:字典里空间 × 风格有 **20 个组合**,后台很可能配不全;
        若未配置就让生成失败,用户选中没配的组合时会**直接看不到效果图**,而他还以为是自己操作错了。
        陈设缺失是**画质问题**,不是功能问题 —— 把"后台漏配"暴露给**监控与后台**
        (靠 WARN 与 `furnishConfigured`),而不是让用户承担。

  /internal/generate/callback:
    post:
      tags: [generate]
      x-direction: Python → Java
      summary: 生成结果回传
      description: |
        Python 完成出图后经回调或 MQ 回传结果,Java 更新任务状态并触发方案自动保存(upsert)。
        幂等:以 taskId 去重,回调可能重复到达,靠状态机防护(已 success 则忽略)。§6.2、§6.4、§10.6④
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, status]
              properties:
                taskId: { type: string, description: "对外唯一任务号,回调幂等键", example: "g_1027f3" }
                status: { $ref: './openapi-common.yaml#/components/schemas/TaskStatus' }
                imageUrls:
                  type: array
                  description: 生成成功的图片列表(status=success 时必填)
                  items:
                    type: object
                    required: [url, view]
                    properties:
                      url: { type: string, example: "https://oss/.../a1.png" }
                      view: { type: string, description: default / angle1 …, example: default }
                      isCover: { type: boolean, default: false }
                progress: { type: integer, minimum: 0, maximum: 100, example: 100 }
                error:
                  nullable: true
                  type: object
                  description: status=failed 时的错误信息
                  properties:
                    code: { $ref: './openapi-common.yaml#/components/schemas/ErrorCode' }
                    message: { type: string }
                traceId: { type: string }
      responses:
        '200':
          description: 回传受理结果(幂等:重复回传返回成功但被忽略)
          content:
            application/json:
              schema: { $ref: './openapi-common.yaml#/components/schemas/ApiResponse' }

components:
  # 与 openapi-common.yaml 保持同步(F-4,见 openapi-verification.md §8.4)。
  # OpenAPI 要求 securitySchemes 必须在本文档内声明,无法跨文档 $ref;
  # 缺失时本文件单独解析会报 security-defined(security 悬空)。
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: |
        内部服务间鉴权(Java↔Python),叠加内网 mTLS;不使用用户 JWT。
        网关层阻断 /internal/* 外部访问。§10.4、§6.1
